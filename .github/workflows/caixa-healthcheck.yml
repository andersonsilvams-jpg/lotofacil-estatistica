name: Atualizar histórico da Lotofácil

on:
  workflow_dispatch:
  schedule:
    # Todos os dias às 07:15 no horário de Campo Grande (UTC-4).
    - cron: "15 11 * * *"

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl xlrd
      - name: Baixar e validar histórico
        run: python atualizar_dados.py
      - name: Salvar atualização no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/historico.csv
          if git diff --cached --quiet; then
            echo "O histórico não teve alterações."
          else
            git commit -m "Atualiza histórico da Lotofácil"
            git push
          fi
